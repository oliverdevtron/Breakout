// ============================================================
// AUDIO ENGINE (Web Audio API - Procedural)
// ============================================================
let audioCtx = null;
let masterGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.3;
  masterGain.connect(audioCtx.destination);
}

function playTone(freq, duration, type, vol, detune) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.value = freq;
  if (detune) osc.detune.value = detune;
  gain.gain.setValueAtTime((vol || 0.15), t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(t);
  osc.stop(t + duration);
}

function playNoise(duration, vol) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol || 0.08, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2000;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  src.start(t);
  src.stop(t + duration);
}

const Sound = {
  brickBreak(tier) {
    const baseFreq = 300 + tier * 80;
    playTone(baseFreq, 0.08, 'square', 0.12);
    playNoise(0.05, 0.06);
  },
  paddleHit() {
    playTone(180, 0.1, 'triangle', 0.1);
    playTone(220, 0.06, 'sine', 0.05);
  },
  wallBounce() {
    playTone(400, 0.03, 'sine', 0.06);
  },
  powerUp() {
    playTone(523, 0.08, 'sine', 0.1);
    setTimeout(() => playTone(659, 0.08, 'sine', 0.1), 60);
    setTimeout(() => playTone(784, 0.12, 'sine', 0.12), 120);
  },
  loseLife() {

    setTimeout(() => playTone(120, 0.3, 'sawtooth', 0.08), 200);
  },
  gameOver() {
    playTone(400, 0.2, 'sawtooth', 0.12);

    setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.1), 300);
    setTimeout(() => playTone(100, 0.5, 'sawtooth', 0.08), 450);
  },
  levelComplete() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((n, i) => {

    const freq = 400 + Math.min(multiplier, 10) * 60;
    playTone(freq, 0.06, 'sine', 0.08);
  },
  countdown() {

  },
  countdownGo() {
    playTone(880, 0.2, 'square', 0.12);
  }
};

// ============================================================
// PARTICLE SYSTEM (Object Pool)
// ============================================================
class Particle {
  constructor() { this.active = false; }

  init(x, y, vx, vy, color, life, size, gravity, fadeRate) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.size = size || 3;
    this.gravity = gravity || 200;
    this.fadeRate = fadeRate || 1;
    this.active = true;
    return this;
  }

  update(dt) {
    if (!this.active) return;
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt * this.fadeRate;
    if (this.life <= 0) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    const alpha = Math.max(0, this.life / this.maxLife);
    const s = this.size * alpha;
    ctx.globalAlpha = alpha * 0.8;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - s / 2, this.y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }
}

class ParticlePool {
  constructor(size) {
    this.pool = [];
    for (let i = 0; i < size; i++) this.pool.push(new Particle());
    this.activeCount = 0;
  }

  emit(x, y, vx, vy, color, life, size, gravity, fadeRate) {
    for (let i = 0; i < this.pool.length; i++) {
      if (!this.pool[i].active) {
        this.pool[i].init(x, y, vx, vy, color, life, size, gravity, fadeRate);
        this.activeCount++;
        return this.pool[i];
      }
    }
    return null;
  }

  update(dt) {
    this.activeCount = 0;
    for (let i = 0; i < this.pool.length; i++) {
      if (this.pool[i].active) {
        this.pool[i].update(dt);
        if (this.pool[i].active) this.activeCount++;
      }
    }
  }

  draw(ctx) {
    for (let i = 0; i < this.pool.length; i++) {
      if (this.pool[i].active) this.pool[i].draw(ctx);
    }
  }

  clear() {
    for (let i = 0; i < this.pool.length; i++) this.pool[i].active = false;
    this.activeCount = 0;
  }
}

// ============================================================
// STARFIELD BACKGROUND
// ============================================================
class Starfield {
  constructor() {
    this.stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      const layer = Math.floor(Math.random() * STAR_LAYERS);
      this.stars.push({
        x: Math.random() * CANVAS_W,
        y: Math.random() * CANVAS_H,
        size: 0.5 + layer * 0.6 + Math.random() * 0.5,
        speed: 5 + layer * 8,
        brightness: 0.2 + layer * 0.25 + Math.random() * 0.15,
        twinkleOffset: Math.random() * Math.PI * 2,
        twinkleSpeed: 1 + Math.random() * 2,
      });
    }
    this.needsRedraw = true;
    this.time = 0;
  }

  update(dt) {
    this.time += dt;
    for (const star of this.stars) {
      star.y += star.speed * dt;
      if (star.y > CANVAS_H) {
        star.y = -2;
        star.x = Math.random() * CANVAS_W;
      }
    }
    this.needsRedraw = true;
  }

  draw(ctx) {
    for (const star of this.stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(this.time * star.twinkleSpeed + star.twinkleOffset);
      const alpha = star.brightness * twinkle;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
// INPUT HANDLER
// ============================================================
const Input = {
  keys: {},
  justPressed: {},
  mouseX: CANVAS_W / 2,
  useMousePaddle: false,

  init() {
    window.addEventListener('keydown', (e) => {
      if (!this.keys[e.code]) this.justPressed[e.code] = true;
      this.keys[e.code] = true;
      if (['ArrowLeft', 'ArrowRight', 'Space', 'KeyP', 'Escape'].includes(e.code)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      this.keys[e.code] = false;
    });
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_W / rect.width;
      this.mouseX = (e.clientX - rect.left) * scaleX;
      this.useMousePaddle = true;
    });
    canvas.addEventListener('click', (e) => {
      this.justPressed['Click'] = true;
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.justPressed['Click'] = true;
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_W / rect.width;
      this.mouseX = (e.touches[0].clientX - rect.left) * scaleX;
      this.useMousePaddle = true;
    });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = CANVAS_W / rect.width;
      this.mouseX = (e.touches[0].clientX - rect.left) * scaleX;
      this.useMousePaddle = true;
    });
  },

  wasJustPressed(code) {
    return !!this.justPressed[code];
  },

  clearFrame() {
    this.justPressed = {};
  },

  isDown(code) {
    return !!this.keys[code];
  }
};

// ============================================================
// LEVEL DEFINITIONS
// ============================================================
function generateLevel(levelNum) {
  const bricks = [];
  const cols = 10;
  const brickW = (CANVAS_W - (cols + 1) * BRICK_PADDING) / cols;
  const offsetLeft = BRICK_PADDING;
  const level = ((levelNum - 1) % 5) + 1;
  const cycle = Math.floor((levelNum - 1) / 5);

  switch (level) {
    case 1: { // Classic
      const rows = 5 + cycle;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tier = r % BRICK_TIERS.length;
          bricks.push(makeBrick(
            offsetLeft + c * (brickW + BRICK_PADDING),
            BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
            brickW, BRICK_HEIGHT, tier, 1
          ));
        }
      }
      break;
    }
    case 2: { // Diamond
      const rows = 9 + cycle;
      const mid = Math.floor(rows / 2);
      for (let r = 0; r < rows; r++) {
        const dist = Math.abs(r - mid);
        const count = cols - dist * 2;
        if (count <= 0) continue;
        const startCol = Math.floor((cols - count) / 2);
        for (let c = 0; c < count; c++) {
          const tier = (r + c) % BRICK_TIERS.length;
          const hp = dist === 0 ? 2 : 1;
          bricks.push(makeBrick(
            offsetLeft + (startCol + c) * (brickW + BRICK_PADDING),
            BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
            brickW, BRICK_HEIGHT, tier, hp
          ));
        }
      }
      break;
    }
    case 3: { // Fortress
      const rows = 7 + cycle;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const isWall = c === 0 || c === cols - 1;
          const isTop = r === 0;
          const isCore = r >= 2 && r <= 4 && c >= 3 && c <= 6;
          if (r > 0 && !isWall && !isCore && r < rows - 1 && c > 0 && c < cols - 1) {
            if ((r + c) % 3 === 0) continue;
          }
          const tier = isCore ? 6 : isWall ? 5 : r % BRICK_TIERS.length;
          const hp = isCore ? 3 : isWall || isTop ? 2 : 1;
          bricks.push(makeBrick(
            offsetLeft + c * (brickW + BRICK_PADDING),
            BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
            brickW, BRICK_HEIGHT, tier, hp
          ));
        }
      }
      break;
    }
    case 4: { // Zigzag
      const rows = 6 + cycle;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2 === 0) ? 0 : 1;
        for (let c = offset; c < cols; c += 2) {
          const tier = (r * 2 + c) % BRICK_TIERS.length;
          bricks.push(makeBrick(
            offsetLeft + c * (brickW + BRICK_PADDING),
            BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
            brickW, BRICK_HEIGHT, tier, 1 + Math.floor(r / 3)
          ));
        }
      }
      break;
    }
    case 5: { // Pyramid (inverted)
      const rows = 8 + cycle;
      for (let r = 0; r < rows; r++) {
        const count = Math.min(cols, cols - r + 2);
        if (count <= 0) continue;
        const startCol = Math.floor((cols - count) / 2);
        for (let c = 0; c < count; c++) {
          const tier = (r + c) % BRICK_TIERS.length;
          const hp = r < 2 ? 2 : 1;
          bricks.push(makeBrick(
            offsetLeft + (startCol + c) * (brickW + BRICK_PADDING),
            BRICK_OFFSET_TOP + r * (BRICK_HEIGHT + BRICK_PADDING),
            brickW, BRICK_HEIGHT, tier, hp
          ));
        }
      }
      break;
    }
  }
  return bricks;
}

function makeBrick(x, y, w, h, tier, hp) {
  return {
    x, y, w, h,
    tier: Math.min(tier, BRICK_TIERS.length - 1),
    hp: hp || 1,
    maxHp: hp || 1,
    alive: true,
    hitFlash: 0,
  };
}

// ============================================================
// GAME STATE
// ============================================================
const Game = {
  state: STATES.TITLE,
  score: 0,
  highScore: 0,
  lives: STARTING_LIVES,
  level: 1,
  combo: 0,
  maxCombo: 0,
  comboDisplay: 0,
  comboTimer: 0,

  paddle: { x: 0, y: 0, w: 100, h: PADDLE_HEIGHT, baseW: 100, speed: 400 },
  balls: [],
  bricks: [],
  powerups: [],
  activePowerups: [],

  particles: new ParticlePool(PARTICLE_POOL_SIZE),
  starfield: new Starfield(),

  countdownTimer: 0,
  countdownNum: 3,
  stateTimer: 0,
  screenShake: 0,
  screenShakeIntensity: 0,
  titlePulse: 0,
  flashAlpha: 0,

  init() {
    this.paddle.w = 100;
    this.paddle.baseW = 100;
    this.paddle.x = (CANVAS_W - this.paddle.w) / 2;
    this.paddle.y = CANVAS_H - 40;
    this.resetForTitle();
  },

  resetForTitle() {
    this.state = STATES.TITLE;
    this.titlePulse = 0;
    this.stateTimer = 0;
  },

  startNewGame() {
    this.score = 0;
    this.lives = STARTING_LIVES;
    this.level = 1;
    this.combo = 0;
    this.maxCombo = 0;
    this.comboDisplay = 0;
    this.activePowerups = [];
    this.powerups = [];
    this.paddle.w = 100;
    this.paddle.baseW = 100;
    this.paddle.x = (CANVAS_W - this.paddle.w) / 2;
    this.particles.clear();
    this.loadLevel();
    this.startCountdown();
  },

  loadLevel() {
    this.bricks = generateLevel(this.level);
    this.powerups = [];
  },

  startCountdown() {
    this.state = STATES.COUNTDOWN;
    this.countdownTimer = 0;
    this.countdownNum = 3;
    this.resetBall();
    Sound.countdown();
  },

  resetBall() {
    this.balls = [];
    const speed = this.getLevelBallSpeed();
    this.balls.push({
      x: this.paddle.x + this.paddle.w / 2,
      y: this.paddle.y - BALL_RADIUS - 1,
      vx: speed * (Math.random() > 0.5 ? 1 : -1) * 0.7,
      vy: -speed,
      radius: BALL_RADIUS,
      trail: [],
    });
  },

  getLevelBallSpeed() {
    return 250 + (this.level - 1) * 20;
  },

  getLevelPaddleW() {
    return Math.max(60, 100 - (this.level - 1) * 5);
  },

  updatePaddle(dt) {
    const p = this.paddle;
    if (Input.useMousePaddle) {
      const target = Input.mouseX - p.w / 2;
      p.x += (target - p.x) * Math.min(1, dt * 20);
    } else {
      if (Input.isDown('ArrowLeft') || Input.isDown('KeyA')) p.x -= p.speed * dt;
      if (Input.isDown('ArrowRight') || Input.isDown('KeyD')) p.x += p.speed * dt;
    }
    p.x = Math.max(0, Math.min(CANVAS_W - p.w, p.x));
  },

  updateBalls(dt) {
    for (let i = this.balls.length - 1; i >= 0; i--) {
      const ball = this.balls[i];

      // Trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // Wall collisions
      if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        ball.vx = Math.abs(ball.vx);
        Sound.wallBounce();
        this.spawnSparks(ball.x, ball.y, 4, '#00ffff');
      }
      if (ball.x + ball.radius >= CANVAS_W) {
        ball.x = CANVAS_W - ball.radius;
        ball.vx = -Math.abs(ball.vx);
        Sound.wallBounce();
        this.spawnSparks(ball.x, ball.y, 4, '#00ffff');
      }
      if (ball.y - ball.radius <= HUD_HEIGHT) {
        ball.y = HUD_HEIGHT + ball.radius;
        ball.vy = Math.abs(ball.vy);
        Sound.wallBounce();
        this.spawnSparks(ball.x, ball.y, 4, '#00ffff');
      }

      // Paddle collision
      const p = this.paddle;
      if (ball.vy > 0 &&
          ball.y + ball.radius >= p.y &&
          ball.y + ball.radius <= p.y + p.h + ball.vy * dt + 4 &&
          ball.x >= p.x - ball.radius &&
          ball.x <= p.x + p.w + ball.radius) {
        const hitPos = (ball.x - p.x) / p.w;
        const angle = (hitPos - 0.5) * Math.PI * 0.7;
        const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        ball.vx = speed * Math.sin(angle);
        ball.vy = -speed * Math.cos(angle);
        ball.y = p.y - ball.radius;

        if (COMBO_RESET_ON_PADDLE) {
          this.combo = 0;
        }

        Sound.paddleHit();
        this.spawnSparks(ball.x, p.y, 6, COLORS.neonCyan);
      }

      // Brick collisions
      for (const brick of this.bricks) {
        if (!brick.alive) continue;
        if (this.ballBrickCollision(ball, brick, dt)) break;
      }

      // Ball out of bounds (bottom)
      if (ball.y - ball.radius > CANVAS_H) {
        this.balls.splice(i, 1);
      }
    }

    // Check if all balls are gone
    if (this.balls.length === 0 && this.state === STATES.PLAYING) {
      this.lives--;
      this.flashAlpha = 0.4;
      if (this.lives <= 0) {
        this.state = STATES.GAME_OVER;
        this.stateTimer = 0;
        if (this.score > this.highScore) this.highScore = this.score;
        Sound.gameOver();
      } else {
        Sound.loseLife();
        this.activePowerups = [];
        this.paddle.w = this.getLevelPaddleW();
        this.paddle.baseW = this.paddle.w;
        this.startCountdown();
      }
    }
  },

  ballBrickCollision(ball, brick, dt) {
    const bx = brick.x, by = brick.y, bw = brick.w, bh = brick.h;

    // AABB check
    if (ball.x + ball.radius < bx || ball.x - ball.radius > bx + bw ||
        ball.y + ball.radius < by || ball.y - ball.radius > by + bh) {
      return false;
    }

    // Determine collision side
    const overlapLeft = (ball.x + ball.radius) - bx;
    const overlapRight = (bx + bw) - (ball.x - ball.radius);
    const overlapTop = (ball.y + ball.radius) - by;
    const overlapBottom = (by + bh) - (ball.y - ball.radius);

    const minOverlapX = Math.min(overlapLeft, overlapRight);
    const minOverlapY = Math.min(overlapTop, overlapBottom);

    if (minOverlapX < minOverlapY) {
      ball.vx *= -1;
      if (overlapLeft < overlapRight) ball.x = bx - ball.radius;
      else ball.x = bx + bw + ball.radius;
    } else {
      ball.vy *= -1;
      if (overlapTop < overlapBottom) ball.y = by - ball.radius;
      else ball.y = by + bh + ball.radius;
    }

    brick.hp--;
    brick.hitFlash = 0.15;

    if (brick.hp <= 0) {
      brick.alive = false;
      const tierInfo = BRICK_TIERS[brick.tier];
      const points = tierInfo.points * (1 + this.combo * 0.5);
      this.score += Math.round(points);
      this.combo++;
      this.comboDisplay = this.combo;
      this.comboTimer = 1.5;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;

      Sound.brickBreak(brick.tier);
      if (this.combo > 1) Sound.combo(this.combo);

      // Particles
      this.spawnBrickExplosion(brick);

      // Screen shake
      this.screenShake = 0.08;
      this.screenShakeIntensity = 2 + Math.min(this.combo, 8);

      // Power-up drop
      if (Math.random() < POWERUP_DROP_CHANCE) {
        this.spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
      }
    }

    return true;
  },

  spawnBrickExplosion(brick) {
    const cx = brick.x + brick.w / 2;
    const cy = brick.y + brick.h / 2;
    const color = BRICK_TIERS[brick.tier].color;
    const count = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 80 + Math.random() * 180;
      this.particles.emit(
        cx + (Math.random() - 0.5) * brick.w * 0.5,
        cy + (Math.random() - 0.5) * brick.h * 0.5,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        color,
        0.4 + Math.random() * 0.4,
        2 + Math.random() * 4,
        150,
        1.2
      );
    }
  },

  spawnSparks(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 50 + Math.random() * 100;
      this.particles.emit(x, y,
        Math.cos(angle) * speed, Math.sin(angle) * speed,
        color, 0.2 + Math.random() * 0.2, 2, 100, 2);
    }
  },

  spawnPowerup(x, y) {
    const type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
    this.powerups.push({
      x: x - POWERUP_WIDTH / 2,
      y: y,
      w: POWERUP_WIDTH,
      h: POWERUP_HEIGHT,
      type: type,
      time: 0,
    });
  },

  updatePowerups(dt) {
    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const pu = this.powerups[i];
      pu.y += POWERUP_FALL_SPEED * dt;
      pu.time += dt;

      // Collision with paddle
      const p = this.paddle;
      if (pu.y + pu.h >= p.y && pu.y <= p.y + p.h &&
          pu.x + pu.w >= p.x && pu.x <= p.x + p.w) {
        this.activatePowerup(pu.type);
        this.spawnSparks(pu.x + pu.w / 2, pu.y, 10, pu.type.color);
        Sound.powerUp();
        this.powerups.splice(i, 1);
        continue;
      }

      // Off screen
      if (pu.y > CANVAS_H) {
        this.powerups.splice(i, 1);
      }
    }

    // Update active power-up timers
    for (let i = this.activePowerups.length - 1; i >= 0; i--) {
      this.activePowerups[i].remaining -= dt;
      if (this.activePowerups[i].remaining <= 0) {
        this.deactivatePowerup(this.activePowerups[i]);
        this.activePowerups.splice(i, 1);
      }
    }
  },

  activatePowerup(type) {
    switch (type.id) {
      case 'multiball': {
        const existing = this.balls.slice();
        if (existing.length > 0 && this.balls.length < MAX_BALLS) {
          const src = existing[0];
          const speed = Math.sqrt(src.vx * src.vx + src.vy * src.vy);
          for (let a = 0; a < 2; a++) {
            const angle = (a === 0 ? -0.4 : 0.4) + Math.atan2(src.vy, src.vx);
            this.balls.push({
              x: src.x, y: src.y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              radius: BALL_RADIUS,
              trail: [],
            });
          }
        }
        break;
      }
      case 'wide': {
        // Remove existing wide power-up timer, re-add
        this.activePowerups = this.activePowerups.filter(p => p.id !== 'wide');
        this.paddle.w = this.paddle.baseW * 1.5;
        this.activePowerups.push({ id: 'wide', remaining: 10, label: 'W', color: '#00ff88' });
        break;
      }
      case 'slow': {
        this.activePowerups = this.activePowerups.filter(p => p.id !== 'slow');
        for (const ball of this.balls) {
          ball.vx *= 0.7;
          ball.vy *= 0.7;
        }
        this.activePowerups.push({ id: 'slow', remaining: 8, label: 'S', color: '#ffff00' });
        break;
      }
      case 'life': {
        if (this.lives < MAX_LIVES) this.lives++;
        break;
      }
    }
  },

  deactivatePowerup(pu) {
    switch (pu.id) {
      case 'wide':
        this.paddle.w = this.paddle.baseW;
        break;
      case 'slow':
        for (const ball of this.balls) {
          ball.vx /= 0.7;
          ball.vy /= 0.7;
        }
        break;
    }
  },

  checkLevelComplete() {
    if (this.bricks.every(b => !b.alive)) {
      this.state = STATES.LEVEL_COMPLETE;
      this.stateTimer = 0;
      Sound.levelComplete();
      // Burst of particles
      for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 200;
        const colors = [COLORS.neonCyan, COLORS.neonPink, COLORS.neonGreen, COLORS.neonYellow];
        this.particles.emit(
          CANVAS_W / 2, CANVAS_H / 2,
          Math.cos(angle) * speed, Math.sin(angle) * speed,
          colors[Math.floor(Math.random() * colors.length)],
          0.8 + Math.random() * 0.5, 3 + Math.random() * 4, 80, 0.8
        );
      }
    }
  },

  update(dt) {
    this.starfield.update(dt);
    this.particles.update(dt);

    if (this.flashAlpha > 0) this.flashAlpha -= dt * 2;
    if (this.screenShake > 0) this.screenShake -= dt;
    if (this.comboTimer > 0) this.comboTimer -= dt;

    for (const brick of this.bricks) {
      if (brick.hitFlash > 0) brick.hitFlash -= dt;
    }

    switch (this.state) {
      case STATES.TITLE:
        this.titlePulse += dt;
        if (Input.wasJustPressed('Click') || Input.wasJustPressed('Space') || Input.wasJustPressed('Enter')) {
          initAudio();
          this.startNewGame();
        }
        break;

      case STATES.COUNTDOWN:
        this.countdownTimer += dt;
        if (this.countdownTimer >= 1) {
          this.countdownTimer -= 1;
          this.countdownNum--;
          if (this.countdownNum > 0) {
            Sound.countdown();
          } else if (this.countdownNum === 0) {
            Sound.countdownGo();
          }
        }
        if (this.countdownNum <= 0 && this.countdownTimer >= 0.4) {
          this.state = STATES.PLAYING;
        }
        // Keep paddle moveable during countdown
        this.updatePaddle(dt);
        // Ball follows paddle
        if (this.balls.length > 0) {
          this.balls[0].x = this.paddle.x + this.paddle.w / 2;
          this.balls[0].y = this.paddle.y - BALL_RADIUS - 1;
        }
        break;

      case STATES.PLAYING:
        this.updatePaddle(dt);
        this.updateBalls(dt);
        this.updatePowerups(dt);
        if (this.state === STATES.PLAYING) {
          this.checkLevelComplete();
        }
        break;

      case STATES.PAUSED:
        if (Input.wasJustPressed('KeyP') || Input.wasJustPressed('Escape')) {
          this.state = STATES.PLAYING;
        }
        break;

      case STATES.LEVEL_COMPLETE:
        this.stateTimer += dt;
        if (this.stateTimer > 2.5) {
          this.level++;
          this.activePowerups = [];
          this.powerups = [];
          this.paddle.w = this.getLevelPaddleW();
          this.paddle.baseW = this.paddle.w;
          this.loadLevel();
          this.startCountdown();
        }
        break;

      case STATES.GAME_OVER:
        this.stateTimer += dt;
        if ((Input.wasJustPressed('Click') || Input.wasJustPressed('Space') || Input.wasJustPressed('Enter')) && this.stateTimer > 1) {
          this.resetForTitle();
        }
        break;
    }

    // Pause check (from playing state)
    if (this.state === STATES.PLAYING &&
        (Input.wasJustPressed('KeyP') || Input.wasJustPressed('Escape'))) {
      this.state = STATES.PAUSED;
    }
  }
};

// ============================================================
// RENDERER
// ============================================================
const Renderer = {
  draw() {
    ctx.save();

    // Screen shake offset
    let shakeX = 0, shakeY = 0;
    if (Game.screenShake > 0) {
      shakeX = (Math.random() - 0.5) * Game.screenShakeIntensity * 2;
      shakeY = (Math.random() - 0.5) * Game.screenShakeIntensity * 2;
      ctx.translate(shakeX, shakeY);
    }

    // Background
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(-10, -10, CANVAS_W + 20, CANVAS_H + 20);

    // Starfield
    Game.starfield.draw(ctx);

    // Grid overlay
    this.drawGrid();

    // Game elements
    this.drawBricks();
    this.drawPowerups();
    this.drawBalls();
    this.drawPaddle();

    // Particles
    Game.particles.draw(ctx);

    // HUD
    this.drawHUD();

    // State overlays
    switch (Game.state) {
      case STATES.TITLE:
        this.drawTitleScreen();
        break;
      case STATES.COUNTDOWN:
        this.drawCountdown();
        break;
      case STATES.PAUSED:
        this.drawPaused();
        break;
      case STATES.LEVEL_COMPLETE:
        this.drawLevelComplete();
        break;
      case STATES.GAME_OVER:
        this.drawGameOver();
        break;
    }

    // Flash overlay
    if (Game.flashAlpha > 0) {
      ctx.globalAlpha = Game.flashAlpha;
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  },

  drawGrid() {
    ctx.strokeStyle = 'rgba(30, 30, 60, 0.3)';
    ctx.lineWidth = 0.5;
    const spacing = 40;
    for (let x = 0; x < CANVAS_W; x += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CANVAS_H);
      ctx.stroke();
    }
    for (let y = 0; y < CANVAS_H; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CANVAS_W, y);
      ctx.stroke();
    }
  },

  drawPaddle() {
    const p = Game.paddle;
    const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    grad.addColorStop(0, '#00ffff');
    grad.addColorStop(1, '#0088aa');
    ctx.fillStyle = grad;

    // Rounded rect
    const r = p.h / 2;
    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y);
    ctx.lineTo(p.x + p.w - r, p.y);
    ctx.arc(p.x + p.w - r, p.y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(p.x + r, p.y + p.h);
    ctx.arc(p.x + r, p.y + r, r, Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.fill();

    // Glow
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
  },

  drawBalls() {
    for (const ball of Game.balls) {
      // Trail
      for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        const alpha = (i / ball.trail.length) * 0.3;
        const size = ball.radius * (i / ball.trail.length) * 0.8;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Ball glow
      const grd = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.radius * 2.5);
      grd.addColorStop(0, 'rgba(255,255,255,0.3)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius * 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Ball body
      const ballGrad = ctx.createRadialGradient(
        ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, 0,
        ball.x, ball.y, ball.radius
      );
      ballGrad.addColorStop(0, '#ffffff');
      ballGrad.addColorStop(1, '#aaddff');
      ctx.fillStyle = ballGrad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  },

  drawBricks() {
    for (const brick of Game.bricks) {
      if (!brick.alive) continue;
      const tier = BRICK_TIERS[brick.tier];

      // Brick gradient
      const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
      grad.addColorStop(0, tier.gradient[0]);
      grad.addColorStop(1, tier.gradient[1]);

      ctx.fillStyle = grad;
      ctx.fillRect(brick.x, brick.y, brick.w, brick.h);

      // Top highlight
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(brick.x, brick.y, brick.w, 2);

      // Glow
      ctx.shadowColor = tier.glow;
      ctx.shadowBlur = 6;
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
      ctx.shadowBlur = 0;

      // HP indicator for multi-hit bricks
      if (brick.maxHp > 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = '10px Orbitron, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(brick.hp.toString(), brick.x + brick.w / 2, brick.y + brick.h / 2 + 3);
      }

      // Hit flash
      if (brick.hitFlash > 0) {
        ctx.globalAlpha = brick.hitFlash * 5;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
        ctx.globalAlpha = 1;
      }
    }
  },

  drawPowerups() {
    for (const pu of Game.powerups) {
      const t = pu.time;
      const pulse = 1 + Math.sin(t * 6) * 0.1;

      ctx.save();
      ctx.translate(pu.x + pu.w / 2, pu.y + pu.h / 2);
      ctx.scale(pulse, pulse);

      // Glow
      ctx.shadowColor = pu.type.color;
      ctx.shadowBlur = 12;

      // Background
      ctx.fillStyle = pu.type.color;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(-pu.w / 2 - 2, -pu.h / 2 - 2, pu.w + 4, pu.h + 4);
      ctx.globalAlpha = 1;

      // Border
      ctx.strokeStyle = pu.type.color;
      ctx.lineWidth = 2;
      ctx.strokeRect(-pu.w / 2, -pu.h / 2, pu.w, pu.h);

      // Fill
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-pu.w / 2, -pu.h / 2, pu.w, pu.h);

      // Label
      ctx.fillStyle = pu.type.color;
      ctx.font = 'bold 11px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pu.type.label, 0, 1);

      ctx.shadowBlur = 0;
      ctx.restore();
    }
  },

  drawHUD() {
    // HUD background
    ctx.fillStyle = COLORS.hudBg;
    ctx.fillRect(0, 0, CANVAS_W, HUD_HEIGHT);
    ctx.strokeStyle = 'rgba(0,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, HUD_HEIGHT);
    ctx.lineTo(CANVAS_W, HUD_HEIGHT);
    ctx.stroke();

    // Score
    ctx.fillStyle = COLORS.text;
    ctx.font = '14px Orbitron, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`SCORE ${Game.score}`, 12, HUD_HEIGHT / 2);

    // High Score
    ctx.fillStyle = COLORS.textDim;
    ctx.font = '10px Orbitron, sans-serif';
    ctx.fillText(`HI ${Game.highScore}`, 180, HUD_HEIGHT / 2);

    // Level
    ctx.fillStyle = COLORS.neonCyan;
    ctx.font = '12px Orbitron, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`LEVEL ${Game.level}`, CANVAS_W / 2, HUD_HEIGHT / 2);

    // Combo
    if (Game.comboTimer > 0 && Game.comboDisplay > 1) {
      const scale = 1 + Math.sin(Game.comboTimer * 8) * 0.15;
      ctx.save();
      ctx.translate(CANVAS_W / 2 + 80, HUD_HEIGHT / 2);
      ctx.scale(scale, scale);
      ctx.fillStyle = COLORS.neonYellow;
      ctx.font = 'bold 14px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`x${Game.comboDisplay}`, 0, 0);
      ctx.restore();
    }

    // Lives (hearts)
    const heartSize = 12;
    const heartStartX = CANVAS_W - 15 - (Game.lives * (heartSize + 6));
    for (let i = 0; i < Game.lives; i++) {
      const hx = heartStartX + i * (heartSize + 6);
      const hy = HUD_HEIGHT / 2;
      this.drawHeart(hx, hy, heartSize, COLORS.heart);
    }

    // Active power-up indicators
    let puX = CANVAS_W - 15 - (Game.lives * (heartSize + 6)) - 10;
    for (const pu of Game.activePowerups) {
      puX -= 50;
      ctx.fillStyle = pu.color;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(puX, 6, 44, HUD_HEIGHT - 12);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = pu.color;
      ctx.lineWidth = 1;
      ctx.strokeRect(puX, 6, 44, HUD_HEIGHT - 12);
      ctx.fillStyle = pu.color;
      ctx.font = '9px Orbitron, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${pu.label} ${Math.ceil(pu.remaining)}s`, puX + 22, HUD_HEIGHT / 2 + 1);
    }
  },

  drawHeart(cx, cy, size, color) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    const s = size / 2;
    ctx.moveTo(cx, cy + s * 0.4);
    ctx.bezierCurveTo(cx, cy - s * 0.2, cx - s, cy - s * 0.6, cx - s, cy);
    ctx.bezierCurveTo(cx - s, cy + s * 0.5, cx, cy + s * 0.8, cx, cy + s);
    ctx.bezierCurveTo(cx, cy + s * 0.8, cx + s, cy + s * 0.5, cx + s, cy);
    ctx.bezierCurveTo(cx + s, cy - s * 0.6, cx, cy - s * 0.2, cx, cy + s * 0.4);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  },

  drawTitleScreen() {
    // Dim overlay
    ctx.fillStyle = 'rgba(10, 10, 26, 0.75)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Title
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Glow
    ctx.shadowColor = COLORS.neonCyan;
    ctx.shadowBlur = 30;
    ctx.fillStyle = COLORS.neonCyan;
    ctx.font = 'bold 56px Orbitron, sans-serif';
    ctx.fillText('BREAKOUT', CANVAS_W / 2, CANVAS_H / 2 - 60);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.fillStyle = COLORS.neonPink;
    ctx.font = '16px Orbitron, sans-serif';
    ctx.shadowColor = COLORS.neonPink;
    ctx.shadowBlur = 10;
    ctx.fillText('NEON ARCADE', CANVAS_W / 2, CANVAS_H / 2 - 15);
    ctx.shadowBlur = 0;

    // Click to start (pulsing)
    const pulse = 0.5 + Math.sin(Game.titlePulse * 3) * 0.5;
    ctx.globalAlpha = 0.5 + pulse * 0.5;
    ctx.fillStyle = COLORS.text;
    ctx.font = '14px Orbitron, sans-serif';
    ctx.fillText('CLICK OR PRESS SPACE TO START', CANVAS_W / 2, CANVAS_H / 2 + 50);
    ctx.globalAlpha = 1;

    // Controls
    ctx.fillStyle = COLORS.textDim;
    ctx.font = '11px Orbitron, sans-serif';
    ctx.fillText('ARROW KEYS / MOUSE TO MOVE', CANVAS_W / 2, CANVAS_H / 2 + 100);
    ctx.fillText('P / ESC TO PAUSE', CANVAS_W / 2, CANVAS_H / 2 + 120);

    ctx.restore();
  },

  drawCountdown() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const num = Game.countdownNum;
    if (num > 0) {
      const progress = Game.countdownTimer;
      const scale = 1 + (1 - progress) * 0.5;
      const alpha = Math.max(0, 1 - progress * 0.3);

      ctx.globalAlpha = alpha;
      ctx.translate(CANVAS_W / 2, CANVAS_H / 2 - 30);
      ctx.scale(scale, scale);
      ctx.shadowColor = COLORS.neonCyan;
      ctx.shadowBlur = 20;
      ctx.fillStyle = COLORS.neonCyan;
      ctx.font = 'bold 72px Orbitron, sans-serif';
      ctx.fillText(num.toString(), 0, 0);
    } else {
      const alpha = Math.max(0, 1 - Game.countdownTimer * 2.5);
      ctx.globalAlpha = alpha;
      ctx.shadowColor = COLORS.neonGreen;
      ctx.shadowBlur = 25;
      ctx.fillStyle = COLORS.neonGreen;
      ctx.font = 'bold 48px Orbitron, sans-serif';
      ctx.fillText('GO!', CANVAS_W / 2, CANVAS_H / 2 - 30);
    }

    ctx.restore();
  },

  drawPaused() {
    ctx.fillStyle = 'rgba(10, 10, 26, 0.7)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = COLORS.neonPink;
    ctx.shadowBlur = 20;
    ctx.fillStyle = COLORS.neonPink;
    ctx.font = 'bold 42px Orbitron, sans-serif';
    ctx.fillText('PAUSED', CANVAS_W / 2, CANVAS_H / 2 - 20);
    ctx.shadowBlur = 0;

    ctx.fillStyle = COLORS.textDim;
    ctx.font = '14px Orbitron, sans-serif';
    ctx.fillText('PRESS P OR ESC TO RESUME', CANVAS_W / 2, CANVAS_H / 2 + 30);
    ctx.restore();
  },

  drawLevelComplete() {
    const progress = Math.min(Game.stateTimer / 2.5, 1);

    ctx.fillStyle = `rgba(10, 10, 26, ${0.5 * progress})`;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (Game.stateTimer > 0.3) {
      const alpha = Math.min(1, (Game.stateTimer - 0.3) * 2);
      ctx.globalAlpha = alpha;
      ctx.shadowColor = COLORS.neonGreen;
      ctx.shadowBlur = 25;
      ctx.fillStyle = COLORS.neonGreen;
      ctx.font = 'bold 40px Orbitron, sans-serif';
      ctx.fillText('LEVEL COMPLETE', CANVAS_W / 2, CANVAS_H / 2 - 30);
      ctx.shadowBlur = 0;
    }

    if (Game.stateTimer > 0.8) {
      const alpha = Math.min(1, (Game.stateTimer - 0.8) * 2);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = COLORS.text;
      ctx.font = '16px Orbitron, sans-serif';
      ctx.fillText(`NEXT: LEVEL ${Game.level + 1}`, CANVAS_W / 2, CANVAS_H / 2 + 20);
    }

    ctx.restore();
  },

  drawGameOver() {
    const progress = Math.min(Game.stateTimer / 1, 1);

    ctx.fillStyle = `rgba(10, 10, 26, ${0.8 * progress})`;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (Game.stateTimer > 0.3) {
      const alpha = Math.min(1, (Game.stateTimer - 0.3) * 2);
      ctx.globalAlpha = alpha;

      ctx.shadowColor = COLORS.neonRed;
      ctx.shadowBlur = 25;
      ctx.fillStyle = COLORS.neonRed;
      ctx.font = 'bold 48px Orbitron, sans-serif';
      ctx.fillText('GAME OVER', CANVAS_W / 2, CANVAS_H / 2 - 60);
      ctx.shadowBlur = 0;
    }

    if (Game.stateTimer > 0.8) {
      const alpha = Math.min(1, (Game.stateTimer - 0.8) * 2);
      ctx.globalAlpha = alpha;

      ctx.fillStyle = COLORS.text;
      ctx.font = '18px Orbitron, sans-serif';
      ctx.fillText(`FINAL SCORE: ${Game.score}`, CANVAS_W / 2, CANVAS_H / 2 - 10);

      if (Game.score >= Game.highScore && Game.score > 0) {
        ctx.fillStyle = COLORS.neonYellow;
        ctx.font = '14px Orbitron, sans-serif';
        ctx.fillText('NEW HIGH SCORE!', CANVAS_W / 2, CANVAS_H / 2 + 20);
      }

      ctx.fillStyle = COLORS.textDim;
      ctx.font = '12px Orbitron, sans-serif';
      ctx.fillText(`MAX COMBO: x${Game.maxCombo}  |  LEVEL REACHED: ${Game.level}`, CANVAS_W / 2, CANVAS_H / 2 + 50);
    }

    if (Game.stateTimer > 1.2) {
      const pulse = 0.5 + Math.sin(Game.stateTimer * 3) * 0.5;
      ctx.globalAlpha = 0.5 + pulse * 0.5;
      ctx.fillStyle = COLORS.text;
      ctx.font = '14px Orbitron, sans-serif';
      ctx.fillText('CLICK OR PRESS SPACE TO CONTINUE', CANVAS_W / 2, CANVAS_H / 2 + 90);
    }

    ctx.restore();
  },
};

// ============================================================
// MAIN LOOP (Fixed Timestep)
// ============================================================
Input.init();
Game.init();

let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);

  const ms = timestamp || 0;
  let frameTime = (ms - lastTime) / 1000;
  lastTime = ms;

  if (frameTime > MAX_FRAME_TIME) frameTime = MAX_FRAME_TIME;

  accumulator += frameTime;

  // Process input once per frame
  while (accumulator >= PHYSICS_DT) {
    Game.update(PHYSICS_DT);
    accumulator -= PHYSICS_DT;
  }

  Input.clearFrame();
  Renderer.draw();
}

requestAnimationFrame(gameLoop);
</script>
